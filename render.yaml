services:
  - type: web
    name: blueprint-api
    runtime: node
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /missing
    x-porender:
      healthTimeoutSeconds: 5
    envVars:
      - fromGroup: shared
      - key: DATABASE_URL
        fromDatabase:
          name: blueprint-data
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: API_KEY
        sync: false
databases:
  - name: blueprint-data
    postgresMajorVersion: "16"
    databaseName: app
    user: app
    diskSizeGB: 1
envVarGroups:
  - name: shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_LABEL
        value: manual
